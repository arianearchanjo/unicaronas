<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha - UniCaronas</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="shortcut icon" href="../img/icon.png" type="image/png">
  <link rel="stylesheet" href="../css/acessibilidade.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="../index.html" class="navbar-brand-wrap">
        <div class="navbar-brand-img"></div>
        <div class="navbar-brand-text">Uni<span>Caronas</span></div>
      </a>
    </div>
  </nav>

  <main class="container">
    <div style="max-width: 450px; margin: 4rem auto;">
      <div id="reset-card" class="card fade-up">
        <div class="card-title">Recuperação</div>
        <h2 style="margin-bottom: 1rem;">Redefinir Senha</h2>
        <p class="text-muted mb-2">Digite sua nova senha abaixo.</p>
        
        <div id="alert-container" role="alert" aria-live="polite"></div>

        <form id="form-redefinir">
          <div class="form-group">
            <label class="form-label" for="nova-senha">Nova Senha</label>
            <input type="password" id="nova-senha" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres" />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmar-senha">Confirmar Nova Senha</label>
            <input type="password" id="confirmar-senha" class="form-control" required minlength="6" placeholder="Repita a nova senha" />
          </div>

          <button type="submit" id="btn-submit" class="btn btn-primary btn-full mt-1">
            Redefinir Senha
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-content">
      <div class="footer-logo">Uni<span>Caronas</span></div>
      <div class="footer-copyright">&copy; 2026 UniCaronas. Todos os direitos reservados.</div>
      <div class="footer-disclaimer">Projeto acadêmico — sistema de pagamento não funcional</div>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script>
    const form = document.getElementById('form-redefinir');
    const senhaInput = document.getElementById('nova-senha');
    const confirmarInput = document.getElementById('confirmar-senha');
    const btn = document.getElementById('btn-submit');

    // Extrair token e e-mail da URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    if (!token || !email) {
      showAlert('Link de recuperação inválido ou incompleto.', 'error');
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const novaSenha = senhaInput.value;
      const confirmarSenha = confirmarInput.value;

      if (novaSenha !== confirmarSenha) {
        return showAlert('As senhas não coincidem.', 'error');
      }

      btn.disabled = true;
      btn.textContent = 'Processando...';

      try {
        await api.redefinirSenha({
          email,
          token,
          novaSenha
        });

        showAlert('Senha redefinida com sucesso! Redirecionando...', 'success');
        
        // Redireciona após 3 segundos
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);

      } catch (err) {
        showAlert(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Redefinir Senha';
      }
    });
  </script>

  <script src="../js/acessibilidade.js"></script>

  <!-- VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>
</body>
</html>
